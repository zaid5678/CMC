[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Environment variables — set these in the Netlify UI (never commit real values):
# SMTP_HOST      — e.g. smtp.gmail.com
# SMTP_PORT      — e.g. 587
# SMTP_USER      — your sending email address
# SMTP_PASS      — Gmail app password or SMTP password
# CONTACT_EMAIL  — where form submissions are delivered
# NEXT_PUBLIC_SITE_URL — e.g. https://chelseamuslimcommunity.org.uk
